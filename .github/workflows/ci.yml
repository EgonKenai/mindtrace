name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build application
        run: pnpm build

  integration:
    name: Firebase Emulator integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      FIREBASE_CLI_DISABLE_USAGE: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Firebase Emulator integration tests
        run: pnpm test:integration

  e2e:
    name: Firebase Emulator browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      FIREBASE_CLI_DISABLE_USAGE: "true"
      PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Firebase Emulator E2E
        run: pnpm test:e2e

      - name: Upload sanitized Playwright report on failure
        if: failure() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/summary.json
          if-no-files-found: ignore
          retention-days: 7
